[project]
name = "wf"
version = "0.1.0"
description = "Conference operations toolkit for OpenReview venue management"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "openreview-py>=1.0",
    "PyJWT>=2.8",
    "lmdb>=1.4",
    "lxml>=5.0",
    "httpx>=0.28.1",
    "httpx-retries>=0.6.0",
]

[project.scripts]
wf = "wf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# B008: do not perform function calls in argument defaults — Typer uses this intentionally
ignore = ["B008", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["wf"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "config", "tests"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
